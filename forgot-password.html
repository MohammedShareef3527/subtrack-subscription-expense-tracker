<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | SubTrack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <main class="auth-card">
        <div class="auth-logo">💳</div>
        <h1>Forgot password?</h1>
        <p>Enter your email, and we'll send you a password reset link.</p>

        <form id="forgotPasswordForm" class="auth-form">
            <label for="resetEmail">Email</label>
            <input
                id="resetEmail"
                type="email"
                placeholder="you@example.com"
                required>

            <button type="submit" class="primary-btn">
                Send Reset Link
            </button>
        </form>

        <p id="resetMessage" class="auth-message"></p>

        <p class="auth-link">
            Remember your password? <a href="/login.html">Login</a>
        </p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        const form = document.getElementById("forgotPasswordForm");
        const message = document.getElementById("resetMessage");
        const button = form.querySelector("button[type='submit']");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const email = document.getElementById("resetEmail").value.trim();
            button.disabled = true;
            button.textContent = "Sending...";
            message.textContent = "";

            try {
                const { error } = await supabaseClient.auth
                    .resetPasswordForEmail(email, {
                        redirectTo: window.location.origin + "/reset-password.html"
                    });

                if (error) throw error;

                message.textContent =
                    "If an account exists for that email, a reset link will be sent. Check your inbox and spam folder.";
                message.className = "auth-message success";
            } catch (error) {
                message.textContent = error.message || "Unable to send the reset email. Please try again.";
                message.className = "auth-message error";
            } finally {
                button.disabled = false;
                button.textContent = "Send Reset Link";
            }
        });
    </script>
</body>
</html>
