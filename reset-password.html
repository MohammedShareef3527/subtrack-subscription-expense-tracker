```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | SubTrack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <main class="auth-card">
        <div class="auth-logo">💳</div>
        <h1>Set a new password</h1>
        <p>Choose a new password for your SubTrack account.</p>

        <form id="resetPasswordForm" class="auth-form">
            <label for="newPassword">New password</label>
            <input
                id="newPassword"
                type="password"
                placeholder="Minimum 6 characters"
                minlength="6"
                required>

            <label for="confirmNewPassword">Confirm new password</label>
            <input
                id="confirmNewPassword"
                type="password"
                placeholder="Enter password again"
                minlength="6"
                required>

            <button type="submit" class="primary-btn">
                Update Password
            </button>
        </form>

        <p id="resetMessage" class="auth-message"></p>

        <p class="auth-link">
            <a href="/login.html">Back to Login</a>
        </p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        const form = document.getElementById("resetPasswordForm");
        const message = document.getElementById("resetMessage");
        const button = form.querySelector("button[type='submit']");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const password = document.getElementById("newPassword").value;
            const confirmPassword =
                document.getElementById("confirmNewPassword").value;

            if (password.length < 6) {
                message.textContent = "Password must contain at least 6 characters.";
                message.className = "auth-message error";
                return;
            }

            if (password !== confirmPassword) {
                message.textContent = "Passwords do not match.";
                message.className = "auth-message error";
                return;
            }

            button.disabled = true;
            button.textContent = "Updating...";
            message.textContent = "";

            try {
                const { data, error: sessionError } =
                    await supabaseClient.auth.getSession();

                if (sessionError) throw sessionError;

                if (!data.session) {
                    throw new Error(
                        "Your reset link may have expired. Request a new password reset email."
                    );
                }

                const { error } = await supabaseClient.auth.updateUser({
                    password: password
                });

                if (error) throw error;

                message.textContent =
                    "Password updated successfully! You can now log in with your new password.";
                message.className = "auth-message success";
                form.reset();
            } catch (error) {
                message.textContent = error.message || "Could not update your password.";
                message.className = "auth-message error";
            } finally {
                button.disabled = false;
                button.textContent = "Update Password";
            }
        });
    </script>
</body>
</html>
```
